name: Update Stats
on:
  schedule:
    - cron: "0 0 * * *" # Run daily
  workflow_dispatch: # Allow manual run
  push:
    branches: ["master", "main"]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 0. Checkout Repository
      - uses: actions/checkout@v4

      # 1. Prepare Assets Directory
      - name: Prepare Assets Directory
        run: mkdir -p assets

      # 2. Download General Stats
      - name: Download General Stats
        run: |
          curl -L -o assets/stats.svg "https://github-readme-stats.vercel.app/api?username=ailuckly&show_icons=true&hide_border=true&theme=tokyonight&include_all_commits=true&rank_icon=github"

      # 4. Download Top Languages
      - name: Download Top Languages
        run: |
          curl -L -o assets/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=ailuckly&layout=compact&hide_border=true&theme=tokyonight&langs_count=8&card_width=360"

      # 5. Download Trophies
      - name: Download Trophies
        run: |
          curl -L -o assets/trophies.svg "https://github-profile-trophy.vercel.app/?username=ailuckly&theme=onedark&no-frame=true&no-bg=true&row=1&column=3"

      # 6. Commit and Push
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "Update stats images"
          git pull --rebase origin main
          git push
